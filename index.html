<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" content="" />
    <title>Poké Atlas — Explore Pokémon</title>
    <script>
      (() => {
        const saved = (() => {
          try {
            return localStorage.getItem('poke-atlas-theme')
          } catch (error) {
            console.warn('Unable to read the saved theme; using the system preference.', error)
            return null
          }
        })()
        const preferred = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches
        const theme = saved === 'dark' || (saved !== 'light' && preferred) ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
